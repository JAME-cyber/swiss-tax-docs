[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-tax-docs"
version = "0.1.0"
description = "Parsing déterministe des décisions de taxation suisses avec validators arithmétiques — un LLM peut halluciner un total qui tombe juste, un validator non."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "swiss-tax-docs contributors" }]
keywords = ["switzerland", "taxes", "fiscalité", "pdf", "parsing", "vaud", "fiduciaire"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11", "pypdfium2>=5"]

[project.scripts]
swiss-tax-docs = "swiss_tax_docs.cli:main"

[project.urls]
Homepage = "https://github.com/swiss-tax-docs/swiss-tax-docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real PDF fixture"]
